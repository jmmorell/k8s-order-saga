apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: platform
  labels:
    app.kubernetes.io/name: mailpit
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
    spec:
      # Nothing here calls the Kubernetes API: no ServiceAccount token (ADR 0009).
      automountServiceAccountToken: false
      # Pod Security restricted (ADR 0009): the image runs as root by default; 65534 is nobody.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.33.1
          imagePullPolicy: IfNotPresent
          env:
            - name: MP_SMTP_DISABLE_RDNS
              value: "true"
            # loadgen sends about 2 order emails a second; the default cap (500) evicted alert
            # emails within minutes. 25000 keeps about 3 h of loadgen traffic (about 2 KB per
            # message, so about 50 MB of database).
            - name: MP_MAX_MESSAGES
              value: "25000"
            - name: MP_DATABASE
              value: /data/mailpit.db
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 256Mi}
      volumes:
        # Disposable like the rest of the local cluster: emails are lost when the pod is replaced.
        - name: data
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: platform
spec:
  selector:
    app.kubernetes.io/name: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: http
      port: 8025
      targetPort: http
