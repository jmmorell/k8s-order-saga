# NetworkPolicies of observability (ADR 0009): default-deny ingress, egress left open (Prometheus
# scrapes the API server, the kubelets and CoreDNS; Grafana's sidecars and the operator call the
# API server). Inside the namespace everything may talk; from outside, only the services' OTLP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: observability
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: observability
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
# OTLP/HTTP from the five services; Prometheus scrapes the Collector's exporter on 8889 (also
# covered by allow-same-namespace, stated here so the Collector's inputs are in one place).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector-ingress
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: shop
          podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/name, operator: In, values: [orders, inventory, payments, notifications, loadgen]}
      ports:
        - {protocol: TCP, port: 4318}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - {protocol: TCP, port: 8889}
---
# Not in the traffic matrix, found while verifying it: the API server calls the Prometheus
# Operator's admission webhooks (PrometheusRule and AlertmanagerConfig validation and mutation) on
# the pod's port 10250. The API server runs on the host network, so no namespace or pod selector
# matches it and the source cannot be named without an IP block; the allow is narrowed to this
# pod and port instead. Without it the webhooks time out after 10 s each and fail open
# (failurePolicy Ignore): rules would install unvalidated, 20 s late.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-operator-webhook-ingress
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kube-prometheus-stack-prometheus-operator
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: 10250}
