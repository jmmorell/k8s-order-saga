replicaCount: 2

image:
  repository: ghcr.io/jmmorell/k8s-order-saga/orders
  tag: "dev"

secretEnv:
  - name: POSTGRES_PASSWORD
    secretName: postgres
    key: password

env:
  DATABASE_URL: postgres://postgres:$(POSTGRES_PASSWORD)@postgres.platform.svc.cluster.local:5432/orders?sslmode=disable
  NATS_URL: nats://nats.platform.svc.cluster.local:4222

otel:
  endpoint: http://otel-collector.observability.svc.cluster.local:4318
