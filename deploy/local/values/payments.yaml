replicaCount: 1

image:
  repository: ghcr.io/jmmorell/k8s-order-saga/payments
  tag: "0000000"

secretEnv:
  - name: POSTGRES_PASSWORD
    secretName: postgres
    key: password

env:
  DATABASE_URL: postgres://postgres:$(POSTGRES_PASSWORD)@postgres.platform.svc.cluster.local:5432/payments?sslmode=disable
  NATS_URL: nats://nats.platform.svc.cluster.local:4222
  PAYMENT_FAILURE_RATE: "0.1"
  PAYMENT_LATENCY_MS: "200"

otel:
  endpoint: http://otel-collector.observability.svc.cluster.local:4318
